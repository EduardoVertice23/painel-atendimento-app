<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11241F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Atendimento Cliente BV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

:root{
  --ink:#11241F;
  --bg:#F2F6F4;
  --board-bg:#E8EFEB;
  --card:#FFFFFF;
  --line:#DCE6E1;
  --primary:#2F8F6E;
  --urgent:#E1653D;
  --gold:#C9A24C;
  --text:#1B2A24;
  --text-dim:#5B6B63;
  --text-faint:#8A968F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Newsreader',serif;color:var(--ink);margin:0;}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:var(--bg);z-index:30;padding-bottom:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Newsreader',serif;font-weight:700;font-size:15px;}
.brand h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.brand p{margin:1px 0 0;font-size:12px;color:var(--text-dim);}
.syncdot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);}
.syncdot .d{width:7px;height:7px;border-radius:50%;background:var(--primary);}
.syncdot .d.off{background:var(--urgent);}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line);}
.tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s ease;}
.tab.active{background:var(--ink);color:#fff;}
.addbtn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}

.view{padding:16px 20px 60px;display:none;}
.view.active{display:block;}

.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-top:3px solid var(--kpi-color, var(--ink));}
.kpi .num{font-family:'Newsreader',serif;font-weight:700;font-size:28px;color:var(--ink);line-height:1;}
.kpi .lbl{font-size:12px;color:var(--text-dim);margin-top:6px;}

.panel-row{display:flex;gap:16px;flex-wrap:wrap;}
.panel{flex:1;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
.panel h3{font-size:15px;font-weight:600;margin-bottom:14px;}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.funnel-lbl{width:120px;font-size:12px;color:var(--text-dim);flex:0 0 auto;text-align:right;}
.funnel-track{flex:1;height:20px;background:var(--bg);border-radius:5px;overflow:hidden;}
.funnel-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;transition:width .3s ease;}
.funnel-fill span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#fff;font-weight:600;}

.mini-bars{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
.mini-bars div{height:100%;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);}
.legend .dot{width:8px;height:8px;border-radius:50%;}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0;}
.chip{font-size:10.5px;background:var(--bg);color:var(--text-dim);padding:2px 7px;border-radius:6px;border:1px solid var(--line);}
.mono-sm{width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:700;font-size:7px;color:#fff;margin-top:1px;}
.pri-badge{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--pri-color);white-space:nowrap;}
.pri-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--pri-color);flex:0 0 auto;}
.gauge{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
.gauge-fill{height:100%;border-radius:4px;transition:width .3s ease;}
.days-label{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
.days-label.overdue{color:var(--urgent);font-weight:600;}

.filterlabel{padding:0 0 4px;font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.chipbar{display:flex;gap:6px;padding-bottom:14px;overflow-x:auto;}
.pchip{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:5px 11px 5px 5px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:500;color:var(--text-dim);transition:all .15s ease;white-space:nowrap;}
.pchip.active{border-color:var(--mono-color);background:color-mix(in srgb, var(--mono-color) 10%, white);color:var(--ink);}
.mono{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:700;font-size:9px;color:#fff;background:var(--mono-color);}
.pri-chip{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:6px 12px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dim);transition:all .15s ease;white-space:nowrap;}
.pri-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dot-color);}
.pri-chip.active{border-color:var(--dot-color);color:var(--ink);background:color-mix(in srgb, var(--dot-color) 10%, white);}

.board{display:flex;gap:12px;padding:16px 0 4px;overflow-x:auto;align-items:flex-start;background:var(--board-bg);margin:0 0 20px;border-radius:16px;padding-left:14px;padding-right:14px;}
.col{flex:0 0 250px;min-width:250px;}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;}
.col-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--stage-color);}
.col-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);background:#fff;padding:1px 7px;border-radius:10px;}
.dropzone{min-height:60px;border-radius:12px;transition:background .15s;padding-bottom:6px;}
.dropzone.over{background:rgba(47,143,110,.08);outline:1.5px dashed var(--primary);}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 13px 11px;margin-bottom:9px;cursor:grab;border-top:3px solid var(--stage-color);}
.card:active{cursor:grabbing;}
.card.dim{opacity:.3;}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;}
.card-name{font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--ink);flex:1;line-height:1.25;}
.op-tag{font-size:10px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;}
.price-range{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink);margin:4px 0;font-weight:500;}
.next-action{font-size:12px;color:var(--text);margin:6px 0 4px;padding-top:6px;border-top:1px solid var(--line);}
.next-action b{color:var(--text-dim);font-weight:600;}
.card-foot{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.stage-select{flex:1;font-family:inherit;font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--bg);}
.editbtn,.delbtn,.sugbtn{border:1px solid var(--line);background:var(--bg);border-radius:7px;font-size:11.5px;padding:5px 9px;cursor:pointer;font-family:inherit;color:var(--text-dim);}
.delbtn{color:var(--urgent);}
.sugbtn{color:var(--ink);font-weight:600;}
.suggestion{display:none;background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:9px 10px;margin-top:9px;font-size:12px;color:var(--text);line-height:1.45;}
.suggestion.open{display:block;}
.suggestion .copyln{display:flex;justify-content:flex-end;margin-top:6px;}
.suggestion button{background:var(--ink);color:#fff;border:none;border-radius:6px;font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit;}
.empty-col{text-align:center;color:var(--text-faint);font-size:12px;padding:24px 8px;border:1.5px dashed var(--line);border-radius:12px;}

.stage-group{margin-bottom:22px;}
.stage-group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.stage-group-head .dot{width:9px;height:9px;border-radius:50%;background:var(--sg-color);}
.stage-group-head h3{font-size:14px;}
.stage-group-head .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}
.owner-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--status-color);}
.owner-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.owner-name{font-family:'Newsreader',serif;font-weight:600;font-size:15.5px;color:var(--ink);}
.owner-imovel{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
.status-pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff;background:var(--status-color);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.gauge-row{display:flex;align-items:center;gap:10px;margin:11px 0 8px;}
.owner-meta{font-size:12.5px;color:var(--text);margin-bottom:6px;}
.owner-meta b{color:var(--text-dim);font-weight:500;}
.owner-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.owner-actions button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer;}
.owner-actions select{flex:1;font-family:inherit;font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--bg);}
.owner-actions .danger{color:var(--urgent);}

.overlay{position:fixed;inset:0;background:rgba(17,36,31,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.overlay.open{display:flex;}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 20px 26px;max-height:90vh;overflow-y:auto;animation:slideup .2s ease;}
@media (min-width:600px){.overlay{align-items:center;}.modal{border-radius:18px;}}
@keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h2{font-size:19px;margin:0 0 16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field label span{text-transform:none;font-weight:400;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--bg);}
.field textarea{resize:vertical;min-height:46px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.persona-grid{display:flex;flex-wrap:wrap;gap:7px;}
.persona-opt{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border:1.5px solid var(--line);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text-dim);background:#fff;}
.persona-opt.sel{border-color:var(--p-color);background:color-mix(in srgb, var(--p-color) 12%, white);color:var(--ink);font-weight:600;}
.persona-tip{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-style:italic;min-height:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions button{flex:1;padding:12px;border-radius:10px;font-family:inherit;font-weight:600;font-size:14px;border:none;cursor:pointer;}
.modal-actions .cancel{background:var(--bg);color:var(--text-dim);}
.modal-actions .save{background:var(--primary);color:#fff;}
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .big{font-family:'Newsreader',serif;font-size:17px;color:var(--ink);margin-bottom:6px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">AC</div>
    <div>
      <h1>Atendimento Cliente</h1>
      <p>Proprietários e leads</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="syncdot"><span class="d" id="syncDot"></span><span id="syncLabel">conectando...</span></div>
    <button id="notifBtn" class="addbtn" style="background:var(--card);color:var(--ink);border:1px solid var(--line);">🔔 Ativar avisos</button>
    <div class="tabs">
      <div class="tab active" data-view="dash">Dashboard</div>
      <div class="tab" data-view="owners">Proprietários</div>
      <div class="tab" data-view="buyers">Leads</div>
    </div>
  </div>
</div>

<div class="view active" id="view-dash">
  <div class="kpi-row" id="kpiRow"></div>
  <div class="panel-row">
    <div class="panel"><h3>Funil · Leads</h3><div id="funnelBuyers"></div></div>
    <div class="panel"><h3>Funil · Captação</h3><div id="funnelOwners"></div></div>
  </div>
  <div class="panel-row">
    <div class="panel"><h3>Prioridade dos leads</h3><div class="mini-bars" id="priBars"></div><div class="legend" id="priLegend"></div></div>
    <div class="panel"><h3>Temperatura dos proprietários</h3><div class="mini-bars" id="statusBars"></div><div class="legend" id="statusLegend"></div></div>
  </div>
</div>

<div class="view" id="view-owners">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;">
    <button class="addbtn" id="openImportOwner" style="background:var(--card);color:var(--ink);border:1px solid var(--line);">📋 Importar em massa</button>
    <button class="addbtn" id="openAddOwner">+ Novo proprietário</button>
  </div>
  <div id="ownersList"></div>
</div>

<div class="view" id="view-buyers">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <button class="addbtn" id="copyFormLinkBtn" style="background:var(--card);color:var(--ink);border:1px solid var(--line);">🔗 Copiar link do formulário</button>
    <button class="addbtn" id="openImportBuyer" style="background:var(--card);color:var(--ink);border:1px solid var(--line);">📋 Importar em massa</button>
    <button class="addbtn" id="openAddBuyer">+ Novo cliente</button>
  </div>
  <div class="filterlabel">Tipo de operação</div>
  <div class="chipbar" id="operationbar"></div>
  <div class="filterlabel">Prioridade (triagem)</div>
  <div class="chipbar" id="prioritybar"></div>
  <div class="filterlabel">Perfil (opcional)</div>
  <div class="chipbar" id="personabar"></div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlayOwner">
  <div class="modal">
    <h2 id="ownerModalTitle">Novo proprietário</h2>
    <div class="field"><label>Proprietário</label><input type="text" id="o-nome" placeholder="Nome"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="o-contato" placeholder="(11) 99999-9999"></div>
    <div class="field"><label>Imóvel</label><input type="text" id="o-imovel" placeholder="Ex: Apto Higienópolis 90m²"></div>
    <div class="field-row">
      <div class="field"><label>Etapa</label><select id="o-stage"></select></div>
      <div class="field"><label>Status</label><select id="o-status"><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Último contato</label><input type="date" id="o-data"></div>
      <div class="field"><label>Método sugerido</label>
        <select id="o-metodo"><option value="">—</option><option value="A">A · Especialização</option><option value="B">B · Prova Social</option><option value="C">C · Pergunta Calibrada</option><option value="D">D · Urgência</option><option value="E">E · Permissão</option></select>
      </div>
    </div>
    <div class="field"><label>Próxima ação</label><div class="persona-grid" id="acaoPickerOwner"></div></div>
    <div class="field"><label>Observações</label><textarea id="o-notas" placeholder="Qualquer detalhe importante sobre esse proprietário"></textarea></div>
    <div class="modal-actions"><button class="cancel" id="ownerCancelBtn">Cancelar</button><button class="save" id="ownerSaveBtn">Salvar</button></div>
  </div>
</div>

<div class="overlay" id="overlayBuyer">
  <div class="modal">
    <h2 id="buyerModalTitle">Novo cliente</h2>
    <div class="field-row">
      <div class="field"><label>Cliente</label><input type="text" id="f-nome" placeholder="Nome"></div>
      <div class="field"><label>Operação</label><select id="f-op"><option value="compra">Compra</option><option value="aluguel">Aluguel</option></select></div>
    </div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="f-contato" placeholder="(11) 99999-9999"></div>
    <div class="field"><label>Link do imóvel de interesse <span>(opcional, usado na 1ª mensagem)</span></label><input type="text" id="f-linkAnuncio" placeholder="Cole o link do anúncio (Kenlo, etc)"></div>
    <div class="field-row">
      <div class="field"><label>Responde?</label><select id="f-responde"><option value="">Não avaliado</option><option value="sim">Sim</option><option value="nao">Não</option><option value="sumiu">Sumiu</option></select></div>
      <div class="field"><label>Orçamento compatível?</label><select id="f-orcamento"><option value="">Não avaliado</option><option value="compativel">Compatível</option><option value="incompativel">Incompatível</option><option value="nao_informado">Não informou</option></select></div>
    </div>
    <div class="field"><label>Tem motivo concreto pra fechar?</label>
      <select id="f-motivo"><option value="">Não avaliado</option><option value="sim">Sim, motivo claro</option><option value="nao">Não, só olhando</option><option value="nao_sabe">Não sei ainda</option></select>
    </div>
    <div class="field">
      <label>Perfil de comprador <span>(opcional — só se já teve conversa de verdade)</span></label>
      <div class="persona-grid" id="personaGrid"></div>
      <div class="persona-tip" id="personaTip"></div>
    </div>
    <div class="field">
      <label>Bairros / localização desejada</label>
      <div class="persona-grid" id="bairrosPicker"></div>
    </div>
    <div class="field">
      <label>Tipo de imóvel <span>(pode marcar mais de um)</span></label>
      <div class="persona-grid" id="tipoPicker"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Dormitórios (mín.)</label>
        <div class="persona-grid" id="quartosPicker"></div>
      </div>
      <div class="field"><label>Metros quadrados (aprox.)</label><input type="number" id="f-m2" min="0" placeholder="m²"></div>
    </div>
    <div class="field">
      <label>Vaga de garagem</label>
      <select id="f-vaga"><option value="">Não avaliado</option><option value="indiferente">Indiferente</option><option value="sim">Precisa ter</option><option value="nao">Não precisa</option></select>
    </div>
    <div class="field-row">
      <div class="field"><label id="lbl-precomin">Valor mín.</label><input type="number" id="f-precomin" placeholder="R$"></div>
      <div class="field"><label id="lbl-precomax">Valor máx.</label><input type="number" id="f-precomax" placeholder="R$"></div>
    </div>
    <div class="field">
      <label>Exigências / diferenciais <span>(pode marcar mais de um)</span></label>
      <div class="persona-grid" id="musthavePicker"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Etapa</label><select id="f-stage"></select></div>
      <div class="field"><label>Último contato</label><input type="date" id="f-data"></div>
    </div>
    <div class="field"><label>Próxima ação</label><div class="persona-grid" id="acaoPickerBuyer"></div></div>
    <div class="field"><label>Observações</label><textarea id="f-notas" placeholder="Qualquer detalhe importante sobre esse cliente"></textarea></div>
    <div class="modal-actions"><button class="cancel" id="buyerCancelBtn">Cancelar</button><button class="save" id="buyerSaveBtn">Salvar</button></div>
  </div>
</div>

<div class="overlay" id="overlayImport">
  <div class="modal" style="max-width:600px;">
    <h2 id="importTitle">Importar em massa</h2>
    <div class="field">
      <label>Colunas esperadas, nesta ordem</label>
      <div id="importColumnsHint" style="font-size:12.5px;color:var(--text-dim);background:var(--bg);border-radius:9px;padding:10px 12px;line-height:1.6;"></div>
    </div>
    <div class="field">
      <button id="downloadTemplateBtn" class="editbtn" style="width:100%;padding:9px;">⬇️ Baixar planilha modelo (.csv)</button>
    </div>
    <div class="field">
      <label>Cole aqui as linhas (copiadas do Excel/Google Planilhas, ou separadas por vírgula)</label>
      <textarea id="importText" style="min-height:160px;font-family:'JetBrains Mono',monospace;font-size:12px;" placeholder="Cole os dados aqui..."></textarea>
    </div>

function daysSince(dateStr){
  if(!dateStr) return 999;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now-d)/86400000);
}
function money(n){ if(n===undefined||n===null||n==='') return null; return 'R$ '+Number(n).toLocaleString('pt-BR'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function chipsFrom(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function personaOf(id){ return PERSONAS.find(p=>p.id===id); }

function priorityInfo(c){
  if(c.responde==='sumiu') return {...PRIORITY_GROUPS[3], label:'Sumiu'};
  const anyFilled = c.responde || c.orcamento || c.motivo;
  if(!anyFilled) return {...PRIORITY_GROUPS[2], label:'Não avaliado'};
  let score=0;
  if(c.responde==='sim') score++;
  if(c.orcamento==='compativel') score++;
  if(c.motivo==='sim') score++;
  if(score>=3) return PRIORITY_GROUPS[0];
  if(score===2) return PRIORITY_GROUPS[1];
  return c.orcamento==='incompativel' ? {...PRIORITY_GROUPS[2], label:'Reencaixar orçamento'} : PRIORITY_GROUPS[2];
}
function waLink(contato, texto){
  const digits = (contato||'').replace(/\D/g,'');
  if(!digits) return null;
  const withCountry = digits.length<=11 ? '55'+digits : digits;
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(texto||'')}`;
}
function suggestBuyer(c){
  const stageDict = c.operacao==='aluguel' ? BUYER_STAGE_MSG_ALUGUEL : BUYER_STAGE_MSG_COMPRA;
  const stageMsg = stageDict[c.stage] || '';
  const pri = priorityInfo(c);
  let extra = pri.id==='descartar' ? ' Antes de desistir, vale uma mensagem curta de reengajamento com senso de urgência.' : '';
  const personaTip = c.persona && personaOf(c.persona) ? ' '+personaOf(c.persona).tip : '';
  const first = (c.nome||'').split(' ')[0] || 'tudo bem';
  const bairro = chipsFrom(c.bairros)[0];
  const buscaTexto = c.operacao==='aluguel' ? 'sua busca por locação' : 'sua busca pelo imóvel';
  let ready;
  if(c.stage==='novo'){
    const linkTxt = c.linkAnuncio ? c.linkAnuncio : '[cole aqui o link do imóvel]';
    const formLink = window.location.origin + '/formulario-lead.html';
    ready = `Oi ${first}, tudo bem? Sou o Paulo, consultor da Baru Imóveis. Vi que você se interessou pelo imóvel abaixo:\n${linkTxt}\nVou verificar a disponibilidade dele. Pra eu já te adiantar outras opções parecidas, me conta rapidinho o que você procura aqui (leva 1 minutinho): ${formLink}`;
  } else {
    ready = `Oi ${first}, tudo bem? Passando aqui pra seguir com ${buscaTexto}${bairro?' em '+bairro:''}. ${stageMsg}`;
  }
  return { tip: (stageMsg+personaTip+extra).trim(), ready };
}
function suggestOwner(o){
  const line = METHOD_LINE[o.metodo] || 'Retomar contato com uma abordagem específica pro perfil dele.';
  const first = (o.nome||'').split(' ')[0] || 'tudo bem';
  const intro = o.stage==='contato' ? 'Sou o Paulo, consultor da Baru Imóveis. ' : '';
  const ready = `Oi ${first}, tudo bem? ${intro}Passando aqui sobre o imóvel${o.imovel?' ('+o.imovel+')':''}. ${line}`;
  return { tip: line, ready };
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); const old=btn.textContent; btn.textContent='Copiado!'; setTimeout(()=>btn.textContent=old,1400); }
  catch(e){ alert(text); }
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const buyers = data.compradores, owners = data.proprietarios;
  const overdueBuyers = buyers.filter(c=>daysSince(c.ultimoContato)>=OVERDUE_DAYS_BUYER && c.stage!=='fechado' && c.stage!=='perdido').length;
  const overdueOwners = owners.filter(o=>daysSince(o.ultimoContato)>=(OWNER_THRESH[o.status]||5) && o.stage!=='publicado' && o.stage!=='perdido').length;
  const buyersActive = buyers.filter(c=>c.stage!=='perdido');
  const ownersActive = owners.filter(o=>o.stage!=='perdido');
  const convBuyers = buyersActive.length ? Math.round(buyers.filter(c=>c.stage==='fechado').length/buyersActive.length*100) : 0;
  const convOwners = ownersActive.length ? Math.round(owners.filter(o=>o.stage==='publicado').length/ownersActive.length*100) : 0;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi" style="--kpi-color:#3E7C93"><div class="num">${buyers.length+owners.length}</div><div class="lbl">Contatos ativos no CRM</div></div>
    <div class="kpi" style="--kpi-color:#E1653D"><div class="num">${overdueBuyers+overdueOwners}</div><div class="lbl">Atrasados (precisam de retorno)</div></div>
    <div class="kpi" style="--kpi-color:#1E6B4F"><div class="num">${convBuyers}%</div><div class="lbl">Conversão leads → fechado</div></div>
    <div class="kpi" style="--kpi-color:#8A6D3B"><div class="num">${convOwners}%</div><div class="lbl">Conversão captação → publicado</div></div>
  `;
  const buyerCounts = BUYER_STAGES.filter(s=>s.id!=='perdido').map(s=>({...s, n: buyers.filter(c=>c.stage===s.id).length}));
  const maxB = Math.max(1, ...buyerCounts.map(s=>s.n));
  document.getElementById('funnelBuyers').innerHTML = buyerCounts.map(s=>`
    <div class="funnel-row"><div class="funnel-lbl">${s.label}</div><div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(6,s.n/maxB*100)}%;background:${s.color}"><span>${s.n}</span></div></div></div>`).join('');
  const ownerCounts = OWNER_STAGES.filter(s=>s.id!=='perdido').map(s=>({...s, n: owners.filter(o=>o.stage===s.id).length}));
  const maxO = Math.max(1, ...ownerCounts.map(s=>s.n));
  document.getElementById('funnelOwners').innerHTML = ownerCounts.map(s=>`
    <div class="funnel-row"><div class="funnel-lbl">${s.label}</div><div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(6,s.n/maxO*100)}%;background:${s.color}"><span>${s.n}</span></div></div></div>`).join('');

  const priCounts = PRIORITY_GROUPS.map(g=>({...g, n: buyers.filter(c=>priorityInfo(c).id===g.id).length}));
  const totalPri = Math.max(1, priCounts.reduce((a,g)=>a+g.n,0));
  document.getElementById('priBars').innerHTML = priCounts.map(g=> g.n? `<div style="width:${g.n/totalPri*100}%;background:${g.color}"></div>` : '').join('');
  document.getElementById('priLegend').innerHTML = priCounts.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${g.label} (${g.n})</span>`).join('');

  const stCounts = ['quente','morno','frio'].map(s=>({id:s, color:OWNER_STATUS_COLOR[s], n: owners.filter(o=>o.status===s).length}));
  const totalSt = Math.max(1, stCounts.reduce((a,g)=>a+g.n,0));
  document.getElementById('statusBars').innerHTML = stCounts.map(g=> g.n? `<div style="width:${g.n/totalSt*100}%;background:${g.color}"></div>` : '').join('');
  document.getElementById('statusLegend').innerHTML = stCounts.map(g=>`<span><span class="dot" style="background:${g.color}"></span>${g.id} (${g.n})</span>`).join('');
}

/* ---------- OWNERS VIEW ---------- */
function renderOwners(){
  const list = document.getElementById('ownersList');
  if(data.proprietarios.length===0){
    list.innerHTML = `<div class="empty"><div class="big">Nenhum proprietário ainda</div><div>Adicione o primeiro contato de captação.</div></div>`;
    return;
  }
  list.innerHTML = OWNER_STAGES.map(stage=>{
    const items = data.proprietarios.filter(o=>o.stage===stage.id)
      .sort((a,b)=> (daysSince(b.ultimoContato)/(OWNER_THRESH[b.status]||5)) - (daysSince(a.ultimoContato)/(OWNER_THRESH[a.status]||5)));
    if(items.length===0) return '';
    return `<div class="stage-group">
      <div class="stage-group-head" style="--sg-color:${stage.color}"><span class="dot"></span><h3>${stage.label}</h3><span class="cnt">${items.length}</span></div>
      ${items.map(o=>ownerCardHtml(o)).join('')}
    </div>`;
  }).join('');
  document.querySelectorAll('[data-oact]').forEach(b=>{ b.onclick = ()=>ownerAction(b.dataset.oact, b.dataset.id); });
  document.querySelectorAll('.owner-stage-select').forEach(sel=>{
    sel.onchange = async ()=>{ await setDoc(doc(db,'proprietarios',sel.dataset.id), {stage:sel.value}, {merge:true}); };
  });
  document.querySelectorAll('.owner-sug-btn').forEach(b=>{ b.onclick = ()=>document.getElementById('osug-'+b.dataset.id).classList.toggle('open'); });
  document.querySelectorAll('.owner-copy-btn').forEach(b=>{ b.onclick = ()=>copyText(b.dataset.text, b); });
}
function ownerCardHtml(o){
  const days = daysSince(o.ultimoContato);
  const thresh = OWNER_THRESH[o.status]||5;
  const overdue = days>=thresh;
  const pct = Math.min(100, Math.round((days/thresh)*100));
  const color = OWNER_STATUS_COLOR[o.status];
  const sug = suggestOwner(o);
  const wa = waLink(o.contato, sug.ready);
  return `<div class="owner-card" style="--status-color:${color}">
    <div class="owner-top"><div><div class="owner-name">${escapeHtml(o.nome)}</div>${o.imovel?`<div class="owner-imovel">${escapeHtml(o.imovel)}</div>`:''}${o.contato?`<div class="owner-imovel">📞 ${escapeHtml(o.contato)}</div>`:''}</div><span class="status-pill">${o.status}</span></div>
    <div class="gauge-row"><div class="gauge"><div class="gauge-fill" style="width:${pct}%;background:${color}"></div></div><span class="days-label ${overdue?'overdue':''}">${days===0?'hoje':days+'d'}</span></div>
    ${o.proximaAcao?`<div class="owner-meta"><b>Próxima ação:</b> ${escapeHtml(o.proximaAcao)}</div>`:''}
    ${o.metodo?`<div class="owner-meta"><b>Método:</b> ${o.metodo} · ${METHOD_NAMES[o.metodo]}</div>`:''}
    ${o.notas?`<div class="owner-meta"><b>Obs.:</b> ${escapeHtml(o.notas)}</div>`:''}
    <div class="owner-actions">
      <select class="owner-stage-select" data-id="${o.id}">${OWNER_STAGES.map(s=>`<option value="${s.id}" ${s.id===o.stage?'selected':''}>${s.label}</option>`).join('')}</select>
      <button data-oact="contato" data-id="${o.id}">Contato hoje</button>
      <button class="owner-sug-btn" data-id="${o.id}">Sugestão</button>
      ${wa?`<a href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;"><button type="button">💬 WhatsApp</button></a>`:''}
      <button data-oact="edit" data-id="${o.id}">Editar</button>
      <button class="danger" data-oact="del" data-id="${o.id}">✕</button>
    </div>
    <div class="suggestion" id="osug-${o.id}">${escapeHtml(sug.tip)}<div class="copyln"><button class="owner-copy-btn" data-text="${escapeHtml(sug.ready)}">Copiar mensagem pronta</button></div></div>
  </div>`;
}
async function ownerAction(act, id){
  const o = data.proprietarios.find(x=>x.id===id);
  if(!o) return;
  if(act==='contato'){ await setDoc(doc(db,'proprietarios',id), {ultimoContato: new Date().toISOString().slice(0,10)}, {merge:true}); }
  else if(act==='edit'){ openOwnerModal(o); }
  else if(act==='del'){ if(confirm(`Remover "${o.nome}"?`)){ await deleteDoc(doc(db,'proprietarios',id)); } }
}
function fillOwnerStageSelect(current){
  document.getElementById('o-stage').innerHTML = OWNER_STAGES.map(s=>`<option value="${s.id}" ${s.id===current?'selected':''}>${s.label}</option>`).join('');
}
function openOwnerModal(o){
  editingOwnerId = o ? o.id : null;
  document.getElementById('ownerModalTitle').textContent = o ? 'Editar proprietário' : 'Novo proprietário';
  document.getElementById('o-nome').value = o ? o.nome : '';
  document.getElementById('o-contato').value = o ? o.contato||'' : '';
  document.getElementById('o-imovel').value = o ? o.imovel||'' : '';
  document.getElementById('o-status').value = o ? o.status : 'morno';
  document.getElementById('o-metodo').value = o ? o.metodo||'' : '';
  acaoPickerOwnerHandle = initChipPicker('acaoPickerOwner', OWNER_ACAO_OPTIONS, o ? o.proximaAcao||'' : '', false);
  document.getElementById('o-notas').value = o ? o.notas||'' : '';
  document.getElementById('o-data').value = o ? o.ultimoContato : new Date().toISOString().slice(0,10);
  fillOwnerStageSelect(o ? o.stage : 'contato');
  document.getElementById('overlayOwner').classList.add('open');
}

document.getElementById('ownerCancelBtn').onclick = ()=>document.getElementById('overlayOwner').classList.remove('open');

document.getElementById('ownerSaveBtn').onclick = async ()=>{
  const nome = document.getElementById('o-nome').value.trim();
  if(!nome){ alert('Digite o nome do proprietário'); return; }
  const rec = {
    nome, imovel: document.getElementById('o-imovel').value.trim(),

    proximaAcao: acaoPickerOwnerHandle.getValue(),
    notas: document.getElementById('o-notas').value.trim(),
  };
  const id = editingOwnerId || doc(ownersCol).id;
  await setDoc(doc(db,'proprietarios',id), rec, {merge:true});
  document.getElementById('overlayOwner').classList.remove('open');
};

function initChipPicker(containerId, options, initialCsv, multi=true){
  const selected = new Set(chipsFrom(initialCsv));
  function render(){
    const el = document.getElementById(containerId);
    if(!el) return;
    el.innerHTML = options.map(o=>{
      const sel = selected.has(o);
      return `<div class="persona-opt ${sel?'sel':''}" style="--p-color:#2F8F6E" data-v="${escapeHtml(o)}">${escapeHtml(o)}</div>`;
    }).join('') + `<input type="text" class="chip-custom-input" placeholder="+ outro (Enter)" style="border:1.5px dashed var(--line);border-radius:20px;padding:6px 12px;font-size:12px;width:110px;background:#fff;color:var(--text);">`;
    el.querySelectorAll('.persona-opt').forEach(chip=>{
      chip.onclick = ()=>{
        const v = chip.dataset.v;
        if(!multi){
          if(selected.has(v)) selected.clear();
          else{ selected.clear(); selected.add(v); }
        } else {
          if(selected.has(v)) selected.delete(v); else selected.add(v);
        }
        render();
      };
    });
    const inp = el.querySelector('.chip-custom-input');
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && inp.value.trim()){
        e.preventDefault();
        if(!multi) selected.clear();
        selected.add(inp.value.trim());
        render();
      }
    });
  }
  render();
  return { getValue: ()=> Array.from(selected).join(', ') };
}

  } else if(Notification.permission==='denied'){

function checkOverdueNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = new Date().toISOString().slice(0,10);
  const storeKey = 'avisados-'+today;
  let avisados = [];
  try{ avisados = JSON.parse(localStorage.getItem(storeKey)||'[]'); }catch(e){ avisados=[]; }
  const pendentes = [];
  data.compradores.forEach(c=>{
    if(daysSince(c.ultimoContato)>=OVERDUE_DAYS_BUYER && c.stage!=='fechado' && c.stage!=='perdido'){
      pendentes.push({id:'b-'+c.id, nome:c.nome, dias:daysSince(c.ultimoContato), tipo:'comprador/locatário'});
    }
  });
  data.proprietarios.forEach(o=>{
    const th = OWNER_THRESH[o.status]||5;
    if(daysSince(o.ultimoContato)>=th && o.stage!=='publicado' && o.stage!=='perdido'){
      pendentes.push({id:'o-'+o.id, nome:o.nome, dias:daysSince(o.ultimoContato), tipo:'proprietário'});
    }
  });
  pendentes.forEach(p=>{
    if(!avisados.includes(p.id)){
      try{
        new Notification('Atendimento pendente', { body: `${p.nome} (${p.tipo}) está ${p.dias===0?'sem contato hoje':p.dias+' dias sem contato'}.`, icon: 'icon-192.png' });
      }catch(e){}
      avisados.push(p.id);
    }
  });
  localStorage.setItem(storeKey, JSON.stringify(avisados));
}

function normalizeDate(v){
  if(!v) return new Date().toISOString().slice(0,10);
  v = v.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let [_, d, mo, y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return new Date().toISOString().slice(0,10);
}
function splitLine(line, expectedCols){
  const tabSplit = line.split('\t');
  if(tabSplit.length >= expectedCols - 1) return tabSplit.map(s=>s.trim());
  const semiSplit = line.split(';');
  if(semiSplit.length >= expectedCols - 1) return semiSplit.map(s=>s.trim());
  return line.split(',').map(s=>s.trim());
}
function looksLikeHeader(fields, labels){
  const first = (fields[0]||'').toLowerCase();
  return first.includes('nome');
}

        tipo: (fields[4]||'').trim(),
        precomax: (fields[5]||'').trim(),
        stage: 'novo',
        ultimoContato: normalizeDate(fields[6]),
        proximaAcao: (fields[7]||'').trim(),
        notas: (fields[8]||'').trim(),
      };
      const id = doc(buyersCol).id;
      await setDoc(doc(db,'compradores',id), rec, {merge:true});
    }
    count++;
  }

  btn.textContent = oldLabel; btn.disabled = false;
  document.getElementById('overlayImport').classList.remove('open');
  alert(`Importação concluída: ${count} registro(s) adicionado(s)${skipped?`, ${skipped} ignorado(s) por falta de nome`:''}.`);
};

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
